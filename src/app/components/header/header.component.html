<header class="site-header" [class.is-scrolled]="isScrolled">
  <div class="wrap site-header__bar">
    <a class="site-header__brand" href="#top" (click)="scrollToTop($event)"><span class="brand-mark" aria-hidden="true"></span>Igor Lima</a>

    <button
      class="icon-btn site-header__menu-btn"
      type="button"
      [attr.aria-expanded]="menuOpen"
      aria-controls="site-nav"
      (click)="menuOpen = !menuOpen"
    >
      <i class="mdi" [class.mdi-menu]="!menuOpen" [class.mdi-close]="menuOpen" aria-hidden="true"></i>
      <span class="visually-hidden">{{ 'header.menu' | translate }}</span>
    </button>

    <nav id="site-nav" class="site-header__nav" [class.is-open]="menuOpen">
      <ul class="site-header__links">
        <li><a href="#about" (click)="scrollTo('about', $event)">{{ 'header.about' | translate }}</a></li>
        <li><a href="#my-projects" (click)="scrollTo('my-projects', $event)">{{ 'header.projects' | translate }}</a></li>
        <li><a href="#experience" (click)="scrollTo('experience', $event)">{{ 'header.experience' | translate }}</a></li>
        <li><a href="#contact" (click)="scrollTo('contact', $event)">{{ 'header.contact' | translate }}</a></li>
      </ul>

      <div class="site-header__tools">
        <button
          class="icon-btn"
          type="button"
          (click)="switchLanguage()"
          [attr.aria-label]="'header.switchLanguage' | translate"
        >{{ 'header.lang' | translate }}</button>
        <button
          class="icon-btn"
          type="button"
          (click)="changeTheme()"
          [attr.aria-label]="'header.switchTheme' | translate"
          [attr.aria-pressed]="isDark"
        >
          <i class="mdi" [class.mdi-weather-night]="!isDark" [class.mdi-white-balance-sunny]="isDark" aria-hidden="true"></i>
        </button>
      </div>
    </nav>
  </div>
</header>
