<section class="wrap section">
  <div class="section__head" appReveal>
    <h2 class="section__title">{{ 'contact.title' | translate }}</h2>
  </div>
  <div class="contact" appReveal>
      <div>
        <p class="lead">{{ 'contact.intro' | translate }}</p>
        <div class="contact__direct">
          <a href="mailto:contato@igorlima.dev"><i class="mdi mdi-email-outline" aria-hidden="true"></i>contato&#64;igorlima.dev</a>
          <a href="https://wa.me/5535984325075" target="_blank" rel="noopener"><i class="mdi mdi-whatsapp" aria-hidden="true"></i>+55 (35) 9 8432-5075</a>
        </div>
      </div>

      <form class="form card" [formGroup]="form" (ngSubmit)="sendEmail()" novalidate>
        <div class="field" [class.is-invalid]="isFieldInvalid('from_name')">
          <label for="ct-name">{{ 'contact.namePlaceholder' | translate }}</label>
          <input id="ct-name" type="text" formControlName="from_name" autocomplete="name" />
          <span class="field__error" *ngIf="isFieldInvalid('from_name')">{{ 'contact.nameRequired' | translate }}</span>
        </div>
        <div class="field" [class.is-invalid]="isFieldInvalid('from_email')">
          <label for="ct-email">{{ 'contact.emailPlaceholder' | translate }}</label>
          <input id="ct-email" type="email" formControlName="from_email" autocomplete="email" />
          <span class="field__error" *ngIf="isFieldInvalid('from_email')">{{ 'contact.emailInvalid' | translate }}</span>
        </div>
        <div class="field" [class.is-invalid]="isFieldInvalid('subject')">
          <label for="ct-subject">{{ 'contact.subjectPlaceholder' | translate }}</label>
          <input id="ct-subject" type="text" formControlName="subject" />
          <span class="field__error" *ngIf="isFieldInvalid('subject')">{{ 'contact.subjectRequired' | translate }}</span>
        </div>
        <div class="field" [class.is-invalid]="isFieldInvalid('message')">
          <label for="ct-message">{{ 'contact.messagePlaceholder' | translate }}</label>
          <textarea id="ct-message" rows="5" formControlName="message"></textarea>
          <span class="field__error" *ngIf="isFieldInvalid('message')">{{ 'contact.messageRequired' | translate }}</span>
        </div>
        <button class="btn" type="submit" [disabled]="sending">
          {{ (sending ? 'contact.sending' : 'contact.sendButton') | translate }}
        </button>
      </form>
  </div>
</section>
